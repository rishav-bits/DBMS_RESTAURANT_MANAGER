{% extends "base.html" %}

{% block title %}Log In · Restaurant DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-5 col-md-8">
    <div class="card-glass p-4 p-md-5">
      <!-- Title -->
      <div class="text-center mb-4">
        <span class="badge bg-warning text-dark px-3 py-1 mb-2 fs-6">
          <i class="bi bi-shield-lock-fill me-1"></i> Access Portal
        </span>
        <h2 class="fw-bold text-dark mb-1">Sign In</h2>
        <p class="text-dark fw-semibold mb-0">Sign in to your account to access your role dashboard.</p>
      </div>

      <!-- Quick Demo Login Section -->
      <div class="mb-4 p-3 border-2 border-dark" style="background: #ffffff; border: 2.5px solid #000; box-shadow: 2px 2px 0 #000; border-radius: 8px;">
        <div class="small fw-bold text-dark text-uppercase mb-2 text-center">
          <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Access (1-Click Fill)
        </div>
        <div class="d-flex flex-column gap-2">
          <button type="button" class="btn btn-sm btn-outline-primary d-flex align-items-center justify-content-between" onclick="fillDemo('customer@example.com', 'customer123')">
            <span class="fw-bold">🍽️ Log in as Customer</span>
            <span class="badge bg-warning text-dark">Rohan Jena</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-info d-flex align-items-center justify-content-between" onclick="fillDemo('receptionist@example.com', 'staff123')">
            <span class="fw-bold">📋 Log in as Staff / Receptionist</span>
            <span class="badge bg-info text-dark">Kavita Roy</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-warning d-flex align-items-center justify-content-between" onclick="fillDemo('owner@example.com', 'owner123')">
            <span class="fw-bold">👑 Log in as Restaurant Owner</span>
            <span class="badge bg-success text-dark">Rajesh Khanna</span>
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

        <div class="mb-3">
          <label class="form-label text-dark fw-bold">Email Address *</label>
          <input type="email" name="email" id="login_email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label text-dark fw-bold mb-0">Password *</label>
          </div>
          <input type="password" name="password" id="login_password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
          </button>
        </div>

        <div class="text-center mt-3">
          <span class="text-dark fw-bold">Don't have an account yet?</span>
          <a href="{{ url_for('register') }}" class="fw-bold ms-1" style="color: #0369a1; text-decoration: underline;">
            Register Here &rarr;
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function fillDemo(email, pwd) {
  document.getElementById('login_email').value = email;
  document.getElementById('login_password').value = pwd;
}
</script>
{% endblock %}
